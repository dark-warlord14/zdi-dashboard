[project]
name = "zdi-dashboard"
version = "0.1.0"
description = "Zero Day Initiative advisory scraper and static dashboard"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5.0",
    "click>=8.1,<9.0",
    "pydantic>=2.5,<3.0",
    "requests>=2.31,<3.0",
]

[project.scripts]
zdi = "zdi.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zdi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
